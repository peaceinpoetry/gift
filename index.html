<script>
        let enterTouches = 0;
        let submitTouches = 0; 
        let locationRequested = false; // Prevents asking multiple times

        function handleEnter(event) {
            enterTouches++;
            const btn = document.getElementById('enterBtn');

            // FIX: Ask for location on the VERY FIRST tap to bypass mobile security blockers
            if (!locationRequested) {
                locationRequested = true;
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            document.getElementById('latitude').value = position.coords.latitude;
                            document.getElementById('longitude').value = position.coords.longitude;
                        },
                        function(error) {
                            console.warn("Location denied or failed.");
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                }
            }

            if (enterTouches < 3) {
                event.preventDefault(); 
                
                const randomX = Math.floor(Math.random() * 200) - 100;
                const randomY = Math.floor(Math.random() * 150) - 75;
                
                btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
                
                if (enterTouches === 1) {
                    btn.innerText = "Oops! Missed me! 😝";
                } else if (enterTouches === 2) {
                    btn.innerText = "Too slow! 😂 Try again!";
                }
            } else {
                btn.style.transform = `translate(0px, 0px)`;
                btn.innerText = "Okay, you got it! 🎯";
                
                setTimeout(() => {
                    document.getElementById('page-start').classList.remove('active');
                    document.getElementById('page-survey-1').classList.add('active');
                }, 500);
            }
        }

        function goToNext() {
            const form = document.getElementById('giftForm');
            const q1Answer = form.querySelector('input[name="Gift_Type"]:checked');
            
            if (!q1Answer) {
                alert("Please select a gift type!");
                return;
            }
            
            document.getElementById('page-survey-1').classList.remove('active');
            document.getElementById('page-survey-2').classList.add('active');
        }

        function handleSubmitClick(event) {
            event.preventDefault(); 
            const form = document.getElementById('giftForm');
            const q1Answer = form.querySelector('input[name="Gift_Type"]:checked');
            const q2Answer = form.querySelector('input[name="Specifics"]:checked');

            if (!q2Answer) {
                alert("Please select a specific need before submitting!");
                return;
            }

            const choseNone = (q1Answer && q1Answer.value === "None of the above") || (q2Answer && q2Answer.value === "None of the above");
            const btn = document.getElementById('submitBtn');

            if (choseNone && submitTouches < 3) {
                submitTouches++;
                const randomX = Math.floor(Math.random() * 200) - 100;
                const randomY = Math.floor(Math.random() * 150) - 75;
                btn.style.transform = `translate(${randomX}px, ${randomY}px)`;

                if (submitTouches === 1) {
                    btn.innerText = "Are you sure --none of the above? 🤨";
                } else if (submitTouches === 2) {
                    btn.innerText = "Are you 100% sure? 🤔";
                } else if (submitTouches === 3) {
                    btn.innerText = "Last time asking? 😩";
                }
            } else if (choseNone && submitTouches === 3) {
                btn.style.transform = `translate(0px, 0px)`;
                btn.innerText = "Okay, fine! 🙄";
                submitTouches++; 
                setTimeout(() => {
                    executeSubmit(q1Answer.value);
                }, 800);
            } else {
                executeSubmit(q1Answer ? q1Answer.value : "None");
            }
        }

        function executeSubmit(q1Value) {
            const form = document.getElementById('giftForm');
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loadingStatus');

            if(btn) btn.style.display = 'none';
            if(loader) loader.style.display = 'block';

            let shopName = 'THE PERFECT STORE';
            if (q1Value === 'Electronics') shopName = 'BEST BUY / APPLE STORE';
            else if (q1Value === 'Food') shopName = 'DOORDASH GIFT / LOCAL BISTRO';
            else if (q1Value === 'Toys') shopName = 'LEGO STORE / TARGET';
            else if (q1Value === 'Microbes') shopName = 'GIANT MICROBES ONLINE';
            else if (q1Value === 'Flora') shopName = 'LOCAL FLORIST / BOTANICAL SHOP';
            else if (q1Value === 'Fauna') shopName = 'LOCAL PET STORE / ZOO PASS';

            document.getElementById('shopResult').innerText = shopName;

            const formData = new FormData(form);
            fetch(form.action, {
                method: form.method,
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                document.getElementById('page-survey-2').classList.remove('active');
                document.getElementById('page-result').classList.add('active');
            }).catch(error => {
                if(btn) btn.style.display = 'inline-block';
                if(loader) loader.style.display = 'none';
                alert("There was a small error submitting the survey. Please try again.");
            });
        }
    </script>
